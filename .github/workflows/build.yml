name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies (the lockfile must be up to date)
        run: pnpm i --frozen-lockfile
      - name: Build (what the Decky store builds)
        run: pnpm run build
      - name: Python checks
        run: |
          python3 -m pip install pyflakes
          python3 -m pyflakes main.py bin/dlt_capture.py bin/dlt_retention.py
          python3 tests/backend_memory_test.py
          python3 tests/data_limits_test.py
          python3 tests/helper_retention_test.py
          python3 tests/settings_test.py
      - name: Interface languages (every language has every string)
        run: |
          cd tests/harness
          ENTRY=i18ntest node build.cjs
          node i18ntest.cjs
      - name: Zip
        run: python3 scripts/make_zip.py
      - uses: actions/upload-artifact@v4
        with:
          name: Live-Translator
          path: out/*.zip

  layer:
    # The Vulkan layer is built from layer/dlt_layer.c to show that the binary in bin/ has its source and that it compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the layer
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev
          mkdir -p out
          gcc -shared -fPIC -O2 -std=gnu11 -Wall -Wextra -Wno-unused-parameter -fvisibility=hidden layer/dlt_layer.c -o out/libVkLayer_dlt.so -lpthread
          ls -l out/libVkLayer_dlt.so bin/libVkLayer_dlt.so
      - uses: actions/upload-artifact@v4
        with:
          name: libVkLayer_dlt
          path: out/libVkLayer_dlt.so

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [plugin, layer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Live-Translator
          path: out
      - name: Publish the zip as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" out/*.zip --repo "${{ github.repository }}" --generate-notes
